          <section class="graph-section" data-transition="fade in">
          <h4>Euclidean Roommates Problem</h4>
          <h5>Problem Statement</h5>
            <div style="width: 100%;">
              <div style="width: 49%; float: left;font-size: 0.65em;"> 
                <ul>
                  <li data-fragment-index="0" class="fragment">Agents $V$</br>
                  <li data-fragment-index="1" class="fragment">Embedding $E: V \rightarrow \mathbb{R}^d$</li>
                    <ul>
                      <li data-fragment-index="2" class="fragment">$d \in \mathbb{N}$</li>
                      <li data-fragment-index="3" class="fragment">E.g. $d = 3$</li>
                    </ul>
                  </li>
                  <li data-fragment-index="5"  class="fragment">Room size $s \in \mathbb{N}$
                    <ul>
                      <li data-fragment-index="6" class="fragment">E.g. $s=3$</li>
                      <li data-fragment-index="7" class="fragment">$V = [s\cdot k]$, where $k \in \mathbb{N}$</li>
                    </ul>
                  </li>
                  <li data-fragment-index="8" class="fragment">Game $G = (V, s, E)$</li>
                  <br>
                  <li data-fragment-index="9" class="fragment">Outcome $\pi$ is a partitioning of $V$ into $s$ sized sets</li>
                    <ul>
                      <li data-fragment-index="10" class="fragment">$\pi \subseteq \{R \subseteq V \mid |R| = s\}$</li>
                      <li data-fragment-index="11" class="fragment">$\forall_{R, R' \in \pi}: R \neq R' \iff R \cap R' = \emptyset$</li>
                      <li data-fragment-index="12" class="fragment">$\bigcup_{R \in \pi}R = V$</li>
                    </ul>
                  <br>
                  <li data-fragment-index="13" class="fragment">Preference of $a \in V$ only depends on:<br>
                    <ul>
                      <li data-fragment-index="14" class="fragment">Sum of distances to its roommates in $R \subseteq V$</li>
                      <li data-fragment-index="15" class="fragment">$R \succsim_{a} R' \iff \sum\limits_{a' \in R}\delta(a, a') \leq \sum\limits_{a' \in R'}\delta(a, a')$</li>
                    </ul>
                  </li>
                  <br>
                  <li data-fragment-index="16" class="fragment">$R \succsim_a R'$ <span data-fragment-index="17" class="fragment" style="color:green">✓</span></li>
                  <li data-fragment-index="18" class="fragment">$\pi \succsim \pi'$ <span data-fragment-index="19" class="fragment" style="color:red">?</span></li>
                </ul>
              </div>
              <div style="margin-left: 50%;width:50%" id="graph2-plotly" class="graph"></div>
            </div>
          </section>

        ### Appendix
        #### On the Ascending Layers$^\dagger$

        <section>
          <p>
            The $xy$-plane of the auxiliary set agents $u'_i$ and $l'_i$ is free from other agents, except for the parts of other ascending layers that go straight up. That is, the parts of the chains from $u_j$ to $u'_j$ and from $l'_j$ to $l_j$. Due to the construction of the bottom layer, the distance between two of such parts that go straight up is at least $10-\epsilon$. Thus, when constructing the part of the ascending layer that is parallel to the $xy$-plane, that is the chain from $u'_i$ to $l'_i$, we have enough space to "go around" a straight up chain parts from $u_j$ to $u'_j$ or $l'_j$ to $l_j$. 
            </p>
            <p>
            Additionally, we can compute the distance between 2 lines in 3D space in constant time. The distance formula is $\frac{|(\vec a_2 - \vec a_1) \cdot (\vec b_1 \times \vec b_2)|}{|\vec b_1 \times \vec b_2|}$, where $\vec a_1, \vec a_2$ are position vectors on the two lines, and $\vec b_1, \vec b_2$ are their direction vectors.
            </p>

        } else if (event.fragment.classList.contains("hide")) {

      var sectionEventHandlerBack = async function (event) {

        } else if (event.fragment.id == "result") {
        } else if (event.fragment.id == "graph10-cy_pcx3c") {
